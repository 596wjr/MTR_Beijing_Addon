plugins {
    id 'java'
//    id 'net.minecraftforge.gradle' version '6.0.25'
}

def modName = 'MTR Beijing Addon'
def modVersion = '0.0.2'

repositories {
    flatDir { dirs 'libs' }
    mavenCentral()

    maven { url = "https://maven.aliyun.com/repository/central" }

    // ======= MC 专用 =======
    maven {
        name = "BMCLAPI"
        url = "https://bmclapi2.bangbang93.com/maven"
        allowInsecureProtocol = true
        content {
            includeGroup "net.minecraft"
            includeGroup "net.fabricmc"
            includeGroup "net.minecraftforge"
            includeGroup "dev.architectury"
            includeGroup "org.parchmentmc"
            includeGroup "me.shedaniel"
            includeGroup "com.terraformersmc"
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'com.google.code.gson:gson:2.8.9'
//    compileOnly fg.deobf("net.minecraftforge:forge:40.2.0")
    compileOnly 'net.minecraftforge:forge:1.18.2-40.2.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// 配置打包任务
jar {
    from sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    filesMatching('fabric.mod.json') {
        expand(
                'version': modVersion
        )
    }
    filesMatching('META-INF/mods.toml') {
        expand(
                'version': modVersion
        )
    }

    // 输出文件名：MTR Beijing Addon-1.0.0.jar
    archiveBaseName = modName
    archiveVersion = modVersion
    manifest {
        attributes 'Implementation-Title': modName,
                'Implementation-Version': modVersion
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}